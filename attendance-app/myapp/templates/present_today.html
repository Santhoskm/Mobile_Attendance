<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Present Employees</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .page-title{
            font-size:30px;
            font-weight:bold;
            color:#1b2a4e;
        }

        .card-box{
            background:white;
            border-radius:15px;
            padding:20px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }

        .table thead{
            background:#1b2a4e;
            color:white;
        }

        .badge-present{
            background:#198754;
            padding:8px 15px;
            border-radius:20px;
            color:white;
            font-size:13px;
        }

    </style>

</head>
<body>

<div class="container py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="page-title">
                Present Employees Today
            </h1>

            <p class="text-muted">
                List of employees checked in today
            </p>
        </div>

        <a href="#" class="btn btn-primary">
            Back Dashboard
        </a>

    </div>

    <!-- Search -->
    <div class="card-box mb-4">

        <div class="row">

            <div class="col-md-4">
                <input type="text"
                    class="form-control"
                    placeholder="Search Employee">
            </div>

            <div class="col-md-3">
                <input type="date"
                    class="form-control">
            </div>

            <div class="col-md-3">
                <select class="form-select">
                    <option>All Projects</option>
                    <option>Airport Project</option>
                    <option>Metro Project</option>
                </select>
            </div>

            <div class="col-md-2">
                <button class="btn btn-success w-100">
                    Search
                </button>
            </div>

        </div>

    </div>

    <!-- Table -->
    <div class="card-box">

        <div class="table-responsive">

            <table class="table table-bordered align-middle">

                <thead>

                    <tr>
                        <th>Emp No</th>
                        <th>Employee Name</th>
                        <th>Date</th>
                        <th>Check In</th>
                        <th>Check Out</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

                    
                   {% for i in present_employees %}

<tr>
    <td>{{ i.employee.empno }}</td>
    <td>{{ i.employee.empname }}</td>
    <td>{{ i.date }}</td>
    <td>{{ i.check_in }}</td>
    <td>{{ i.check_out }}</td>
    <td>{{ i.status }}</td>
</tr>

{% endfor %}
                  

                  

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
