<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Solution Login</title>
    <style>
      *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{

    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{

    width:1000px;
    height:560px;

    display:flex;

    background:#111827;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.left{

    width:45%;

    background:linear-gradient(135deg,#2563eb,#1d4ed8);

    color:white;

    padding:60px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{

    margin-bottom:70px;
}

.logo-box{

    width:70px;
    height:70px;

    border-radius:18px;

    background:white;

    color:#2563eb;

    font-size:26px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:20px;
}

.logo h1{

    font-size:34px;
}

.logo p{

    opacity:.8;
}

.left h2{

    font-size:38px;
    margin-bottom:15px;
}

.subtitle{

    color:#dbeafe;

    line-height:28px;

    font-size:17px;
}

.right{

    width:55%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#111827;
}

form{

    width:380px;
}

form h2{

    color:white;

    margin-bottom:35px;

    font-size:34px;
}

.input-group{

    margin-bottom:22px;
}

label{

    color:#94a3b8;

    display:block;

    margin-bottom:8px;
}

input{

    width:100%;

    padding:15px;

    background:#1e293b;

    border:1px solid #334155;

    border-radius:10px;

    color:white;

    outline:none;

    font-size:16px;
}

input:focus{

    border:1px solid #3b82f6;

    box-shadow:0 0 10px rgba(59,130,246,.4);
}

.remember{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

    color:white;

    font-size:14px;
}

.remember a{

    color:#3b82f6;

    text-decoration:none;
}

button{

    width:100%;

    padding:15px;

    border:none;

    background:#2563eb;

    color:white;

    font-size:18px;

    border-radius:10px;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    background:#1d4ed8;
}

@media(max-width:900px){

.container{

    width:95%;

    flex-direction:column;

    height:auto;
}

.left{

    width:100%;
    text-align:center;
}

.right{

    width:100%;

    padding:40px;
}

}
    </style>
</head>
<body>

<div class="container">

    <div class="left">
        <div class="logo">
            <div class="logo-box">IET</div>

            <h1>Smart Solution</h1>
            <p>Admin Portal</p>
        </div>

        <h2>Welcome Back 👋</h2>

        <p class="subtitle">
            Sign in to continue managing employees, attendance and projects.
        </p>
    </div>

    <div class="right">

        <form method="post">

            {% csrf_token %}
            <h2>Login</h2>

            <div class="input-group">
                <label>Emp No</label>
                <input type="text" name="empid" placeholder="Enter username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password">
            </div>

            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit">Login</button>

           {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

        </form>

    </div>

</div>

</body>
</html>
